[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stroller-vibe"
version = "0.1.0"
description = "Measure stroller vibration exposure for infants (ISO 2631-1 weighting) from phone or sensor recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.6", "pillow>=9.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
strollervibe = "strollervibe.__main__:main"

[tool.setuptools]
packages = ["strollervibe"]
